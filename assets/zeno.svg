<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="900" height="330" rx="14" fill="#0b0a12"/>
  <text x="70" y="65" fill="#f3efff" font-size="14" font-weight="700">ZENO'S DICHOTOMY</text><text x="70" y="81" fill="#8b82a8" font-size="11">constant speed v · step n covers d₀/2ⁿ in time d₀/(2ⁿv)</text><line x1="70" x2="800" y1="95" y2="95" stroke="#2c2640" stroke-width="2"/><line x1="435.0" x2="435.0" y1="88" y2="102" stroke="#8b82a8" stroke-width="1"/><line x1="617.5" x2="617.5" y1="88" y2="102" stroke="#8b82a8" stroke-width="1"/><line x1="708.8" x2="708.8" y1="88" y2="102" stroke="#8b82a8" stroke-width="1"/><line x1="754.4" x2="754.4" y1="88" y2="102" stroke="#8b82a8" stroke-width="1"/><line x1="777.2" x2="777.2" y1="88" y2="102" stroke="#8b82a8" stroke-width="1"/><line x1="788.6" x2="788.6" y1="88" y2="102" stroke="#8b82a8" stroke-width="1"/><line x1="794.3" x2="794.3" y1="88" y2="102" stroke="#8b82a8" stroke-width="1"/><line x1="797.1" x2="797.1" y1="88" y2="102" stroke="#8b82a8" stroke-width="1"/><text x="70" y="119" fill="#8b82a8" font-size="10" text-anchor="middle">0</text><text x="435" y="119" fill="#8b82a8" font-size="10" text-anchor="middle">½</text><text x="618" y="119" fill="#8b82a8" font-size="10" text-anchor="middle">¾</text>
