  <circle cy="95" r="7" fill="#4f8cff" filter="url(#glow)"><animate attributeName="cx" values="70;800;800" keyTimes="0;0.3333;1" dur="12.0s" repeatCount="indefinite"/></circle><text x="800" y="65" fill="#4f8cff" font-size="12" text-anchor="end" opacity="0">arrives at t = d₀/v: infinitely many steps, finite time<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.3333" dur="12.0s" repeatCount="indefinite"/></text>
  <text x="70" y="185" fill="#f3efff" font-size="14" font-weight="700">GOJO'S INFINITY</text><text x="70" y="201" fill="#8b82a8" font-size="11">every halving takes the same time τ · ẋ = −kx</text><line x1="70" x2="800" y1="215" y2="215" stroke="#2c2640" stroke-width="2"/><line x1="435.0" x2="435.0" y1="208" y2="222" stroke="#8b82a8" stroke-width="1"/><line x1="617.5" x2="617.5" y1="208" y2="222" stroke="#8b82a8" stroke-width="1"/><line x1="708.8" x2="708.8" y1="208" y2="222" stroke="#8b82a8" stroke-width="1"/><line x1="754.4" x2="754.4" y1="208" y2="222" stroke="#8b82a8" stroke-width="1"/><line x1="777.2" x2="777.2" y1="208" y2="222" stroke="#8b82a8" stroke-width="1"/><line x1="788.6" x2="788.6" y1="208" y2="222" stroke="#8b82a8" stroke-width="1"/><line x1="794.3" x2="794.3" y1="208" y2="222" stroke="#8b82a8" stroke-width="1"/><line x1="797.1" x2="797.1" y1="208" y2="222" stroke="#8b82a8" stroke-width="1"/><text x="70" y="239" fill="#8b82a8" font-size="10" text-anchor="middle">0</text><text x="435" y="239" fill="#8b82a8" font-size="10" text-anchor="middle">½</text><text x="618" y="239" fill="#8b82a8" font-size="10" text-anchor="middle">¾</text>
